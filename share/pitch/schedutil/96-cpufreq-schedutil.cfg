# passive cpufreq driver mode + schedutil governor at boot. The stock file carries the Intel arguments; schedutil-setup
# writes the ones for the driver it finds (AMD: amd_pstate=passive; other drivers: only cpufreq.default_governor).
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT intel_pstate=passive cpufreq.default_governor=schedutil"
